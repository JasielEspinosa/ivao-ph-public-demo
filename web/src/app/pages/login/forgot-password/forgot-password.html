<section class="home-shell">
  <div class="form-shell login-shell">
    <app-placeholder-banner subheading="WELCOME TO" title="IVAO Philippines"></app-placeholder-banner>

    <div class="dashboard-header">
      <h2>Forgot Password</h2>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
      <label
        class="universal-input-field"
        [class.uf-invalid]="form.controls.login_email.touched && form.controls.login_email.hasError('required')"
      >
        <span>Email Address</span>
        <input type="text" formControlName="login_email" placeholder="Enter login email" />
        <small
          class="feedback error"
          *ngIf="form.controls.login_email.touched && form.controls.login_email.hasError('required')"
        >
          Email Address is required.
        </small>
        <small
          class="feedback error"
          *ngIf="
            form.controls.login_email.touched &&
            !form.controls.login_email.hasError('required') &&
            form.controls.login_email.hasError('email')
          "
        >
          Enter a valid email address.
        </small>
      </label>

      <p class="set-password-subtitle" style="margin: 0; text-align: center">
        Enter your login email and we will send a new password to it.
      </p>

      <button type="submit" class="login-submit-button" [disabled]="isBusy" style="margin-top: 2rem">
        {{ isLoading ? 'Sending...' : countdown > 0 ? 'Sending in ' + countdown + 's...' : 'Send Password' }}
      </button>

      <button
        type="button"
        class="universal-button universal-button--cancel"
        *ngIf="isBusy"
        (click)="cancel()"
        style="margin-top: 0.75rem; width: 100%"
      >
        Cancel
      </button>

      <div class="uf-feedback">
        <p
          class="feedback"
          [class.success]="isSuccess"
          [class.error]="!isSuccess"
          *ngIf="feedbackMessage"
          style="margin: 0.75rem 0 0 0"
        >
          {{ feedbackMessage }}
        </p>
      </div>

      <p class="back-to-login">
        <a href="javascript:void(0)" (click)="backToLogin()">Back to Login</a>
      </p>
    </form>
  </div>
</section>
