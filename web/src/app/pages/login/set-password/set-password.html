<section class="home-shell">
  <div
    class="route-loading-overlay"
    *ngIf="isLoading || isValidatingToken"
    role="status"
    aria-live="polite"
    [attr.aria-label]="isValidatingToken ? 'Checking your password setup link' : 'Saving'"
    style="flex-direction: column; gap: 1rem"
  >
    <div class="route-loading-spinner"></div>
    <p *ngIf="isValidatingToken" style="margin: 0; font-weight: 600; color: #004987">
      Checking your password setup link...
    </p>
  </div>

  <div class="form-shell login-shell">
    <app-placeholder-banner subheading="WELCOME TO" title="IVAO Philippines"></app-placeholder-banner>

    <div class="dashboard-header">
      <h2>Set New Password</h2>
      <p class="set-password-subtitle" *ngIf="!isValidatingToken && !isTokenInvalid">
        Your account does not have a password set yet. Please create one to continue.
      </p>
    </div>

    <div class="login-form" *ngIf="!isValidatingToken && isTokenInvalid">
      <div class="uf-feedback">
        <p class="feedback error" style="margin: 0; text-align: center">
          {{ feedbackMessage || 'This password setup link is invalid or has expired.' }}
        </p>
      </div>

      <p class="back-to-login">
        <a href="javascript:void(0)" (click)="backToLogin()">Back to Login</a>
      </p>
    </div>

    <form
      class="login-form"
      [formGroup]="form"
      (ngSubmit)="submit()"
      *ngIf="!isValidatingToken && !isTokenInvalid"
      autocomplete="off"
      data-1p-ignore="true"
      data-bwignore="true"
      data-form-type="other"
      data-keeper-ignore="true"
      data-lpignore="true"
    >
      <label
        class="universal-password-field"
        [class.uf-invalid]="form.controls.new_password.touched && form.controls.new_password.hasError('required')"
      >
        <span>New Password</span>
        <input
          type="password"
          formControlName="new_password"
          placeholder="Enter new password"
          autocomplete="off"
          data-1p-ignore="true"
          data-bwignore="true"
          data-form-type="other"
          data-keeper-ignore="true"
          data-lpignore="true"
        />
        <small
          class="feedback error"
          *ngIf="form.controls.new_password.touched && form.controls.new_password.hasError('required')"
        >
          New Password is required.
        </small>
        <small
          class="feedback error"
          *ngIf="
            form.controls.new_password.touched &&
            !form.controls.new_password.hasError('required') &&
            form.controls.new_password.hasError('minlength')
          "
        >
          Password must be at least 8 characters.
        </small>
      </label>

      <label
        class="universal-password-field"
        [class.uf-invalid]="
          form.controls.confirm_password.touched && form.controls.confirm_password.hasError('required')
        "
      >
        <span>Re-type Password</span>
        <div class="password-peek-field">
          <input
            [type]="isConfirmPasswordPeekActive ? 'text' : 'password'"
            formControlName="confirm_password"
            placeholder="Re-type new password"
            autocomplete="off"
            data-1p-ignore="true"
            data-bwignore="true"
            data-form-type="other"
            data-keeper-ignore="true"
            data-lpignore="true"
          />
          <button
            type="button"
            class="password-peek-button"
            aria-label="Press and hold to show re-typed password"
            (pointerdown)="activateConfirmPasswordPeek($event)"
            (pointerup)="deactivateConfirmPasswordPeek()"
            (pointerleave)="deactivateConfirmPasswordPeek()"
            (pointercancel)="deactivateConfirmPasswordPeek()"
            (lostpointercapture)="deactivateConfirmPasswordPeek()"
            (blur)="deactivateConfirmPasswordPeek()"
            (keydown)="onConfirmPasswordPeekKeydown($event)"
            (keyup)="onConfirmPasswordPeekKeyup($event)"
          >
            <svg *ngIf="!isConfirmPasswordPeekActive" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M2 12c2.2-3.8 5.5-6 10-6s7.8 2.2 10 6c-2.2 3.8-5.5 6-10 6s-7.8-2.2-10-6Zm10 3.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
              />
              <path d="M4 20 20 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <svg *ngIf="isConfirmPasswordPeekActive" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M2 12c2.2-3.8 5.5-6 10-6s7.8 2.2 10 6c-2.2 3.8-5.5 6-10 6s-7.8-2.2-10-6Zm10 3.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
              />
            </svg>
          </button>
        </div>
        <small
          class="feedback error"
          *ngIf="form.controls.confirm_password.touched && form.controls.confirm_password.hasError('required')"
        >
          Re-type Password is required.
        </small>
        <small
          class="feedback error"
          *ngIf="
            form.controls.confirm_password.touched &&
            !form.controls.confirm_password.hasError('required') &&
            form.hasError('passwordMismatch')
          "
        >
          Passwords do not match.
        </small>
      </label>

      <button type="submit" class="login-submit-button" [disabled]="isLoading" style="margin-top: 2rem">
        {{ isLoading ? 'Saving...' : 'Set Password' }}
      </button>

      <app-popup-message
        [type]="isSuccess ? 'success' : 'error'"
        [message]="isTokenInvalid ? '' : feedbackMessage"
        (closed)="feedbackMessage = ''"
      />
    </form>
  </div>
</section>
