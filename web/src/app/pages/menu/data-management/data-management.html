<section class="home-shell">
  <div class="form-shell menu-shell">
    <app-placeholder-banner
      title="Data Management"
      subtitle=""
      [showBackLink]="true"
      backLinkRoute="/home"
      backLinkText="← Back to Home"
    ></app-placeholder-banner>

    <div class="dashboard-header">
      <p>Choose a data management page.</p>
      <div class="menu-search menu-search--icon">
        <label class="menu-search__label" for="data-management-search">Search data management page/s</label>
        <input
          id="data-management-search"
          type="search"
          [(ngModel)]="searchTerm"
          placeholder="Search data management page/s"
        />
        <svg class="search-field-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
      </div>
    </div>

    <div class="menu-columns" appMenuColumns>
      <a *ngFor="let card of sortedCards" [routerLink]="card.route" class="menu-card menu-card--row">
        <div>
          <span class="menu-title">{{ card.title }}</span>
          <span *ngIf="card.subtitle" class="menu-subtitle"> | {{ card.subtitle }}</span>
          <p class="menu-description">{{ card.description }}</p>
        </div>
        <span class="menu-link">Open page →</span>
      </a>
    </div>

    <p *ngIf="sortedCards.length === 0">No selection available</p>
  </div>
</section>
