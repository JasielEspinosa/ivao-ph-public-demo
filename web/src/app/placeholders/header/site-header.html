<header class="site-header">
  <div class="site-header__inner">
    <a
      href="https://ivao.aero/"
      target="_blank"
      rel="noopener noreferrer"
      class="site-logo"
      aria-label="IVAO (opens in a new tab)"
      title="IVAO"
    >
      <img src="images/ivao-ph.png" alt="IVAO Philippines" class="site-logo__img" />
    </a>

    <button
      type="button"
      class="site-menu-button"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="site-nav"
      aria-label="Menu"
      (click)="toggleMenu()"
    >
      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path *ngIf="!menuOpen()" d="M4 6h16M4 12h16M4 18h16" />
        <path *ngIf="menuOpen()" d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>

    <nav id="site-nav" class="site-nav" [class.site-nav--open]="menuOpen()" aria-label="Main menu">
      <a routerLink="/home" routerLinkActive="site-nav__link--active" class="site-nav__link">Home</a>
      <a href="https://webeye.ivao.aero/" target="_blank" rel="noopener noreferrer" class="site-nav__link"
        >Live Traffic</a
      >
      <a routerLink="/members" routerLinkActive="site-nav__link--active" class="site-nav__link">Members</a>
      <a routerLink="/documents" routerLinkActive="site-nav__link--active" class="site-nav__link">Documents</a>

      <div class="site-dropdown">
        <button
          type="button"
          class="site-nav__link site-dropdown__toggle"
          aria-haspopup="true"
          [attr.aria-expanded]="rulesOpen()"
          (click)="toggleRules()"
        >
          Rules and Policies <span class="site-caret" aria-hidden="true">▾</span>
        </button>
        <div class="site-dropdown__menu" *ngIf="rulesOpen()">
          <a routerLink="/privacy-policy" class="site-dropdown__item">Privacy Policy</a>
          <a
            href="https://wiki.ivao.aero/en/home/ivao/regulations"
            target="_blank"
            rel="noopener noreferrer"
            class="site-dropdown__item"
            >IVAO Regulations</a
          >
        </div>
      </div>

      <!-- No pages yet: plain clickable menu text. -->
      <a href="#" class="site-nav__link" (click)="noPageYet($event)">Charts</a>
      <a href="#" class="site-nav__link" (click)="noPageYet($event)">Contacts</a>
    </nav>

    <div class="site-actions">
      <app-theme-toggle *ngIf="showThemeToggle"></app-theme-toggle>

      <a *ngIf="!userLabel" routerLink="/login" class="universal-button universal-button--primary site-login">Log-In</a>

      <div class="site-dropdown" *ngIf="userLabel as label">
        <button
          type="button"
          class="site-user"
          aria-haspopup="true"
          [attr.aria-expanded]="userMenuOpen()"
          (click)="toggleUserMenu()"
        >
          <span class="site-user__name">{{ label }}</span> <span class="site-caret" aria-hidden="true">▾</span>
        </button>
        <div class="site-dropdown__menu site-dropdown__menu--right" *ngIf="userMenuOpen()">
          <a routerLink="/profile-settings" class="site-dropdown__item">Profile Settings</a>
          <a *ngIf="canManageData" routerLink="/data-management" class="site-dropdown__item">Data Management</a>
          <a *ngIf="isAdmin" routerLink="/admin-settings" class="site-dropdown__item">Admin Settings</a>
          <a href="#" class="site-dropdown__item logout-link" (click)="logout(); $event.preventDefault()">Log-Out</a>
        </div>
      </div>
    </div>
  </div>
</header>
