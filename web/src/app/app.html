<div class="route-loading-overlay" *ngIf="isNavigating()" role="status" aria-live="polite" aria-label="Loading">
  <div class="route-loading-spinner"></div>
</div>
<main class="main">
  <app-site-header [showThemeToggle]="showThemeToggle"></app-site-header>
  <section class="route-viewport">
    <router-outlet></router-outlet>
  </section>
  <app-site-footer></app-site-footer>
</main>
<button
  type="button"
  class="back-to-top"
  *ngIf="backToTopEligible() && backToTopScrolled()"
  (click)="scrollToTop()"
  aria-label="Back to top"
  title="Back to top"
>
  <svg
    viewBox="0 0 24 24"
    width="22"
    height="22"
    aria-hidden="true"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M12 19V5M5 12l7-7 7 7" />
  </svg>
</button>
