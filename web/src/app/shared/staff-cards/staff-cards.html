<section class="staff-section" id="staff" aria-labelledby="staff-title">
  <h2 id="staff-title">
    Staff <span class="staff-count">{{ staff.length }}</span>
  </h2>

  <p *ngIf="staff.length === 0" class="staff-empty">{{ emptyMessage }}</p>

  <ul class="staff-grid" [class.staff-grid--circle]="photoStyle === 'circle'" *ngIf="staff.length > 0">
    <li class="staff-card" *ngFor="let member of staff; trackBy: trackByVid">
      <img
        class="staff-card__photo"
        *ngIf="photoStyle === 'portrait' && member.photo_version"
        [appAuthSrc]="photoUrl(member)"
        [alt]="'Photo of ' + displayName(member)"
        width="800"
        height="1000"
      />
      <div class="staff-card__avatar" *ngIf="photoStyle === 'circle'">
        <span aria-hidden="true">{{ initials(member) }}</span>
        <img *ngIf="member.photo_version" [appAuthSrc]="photoUrl(member)" alt="" />
      </div>
      <div class="staff-card__details">
        <p class="staff-card__role" *ngIf="member.role_title">{{ member.role_title }}</p>
        <h3 class="staff-card__name">{{ displayName(member) }}</h3>
        <p class="staff-card__description" *ngIf="member.role_description">{{ member.role_description }}</p>
        <p class="staff-card__line" *ngIf="member.contact_email">
          <a [href]="'mailto:' + member.contact_email">{{ member.contact_email }}</a>
        </p>
        <p class="staff-card__line" *ngIf="member.contact_number">{{ member.contact_number }}</p>
      </div>
    </li>
  </ul>
</section>
