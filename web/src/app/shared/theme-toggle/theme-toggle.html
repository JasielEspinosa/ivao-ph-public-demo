<span class="theme-toggle-wrap">
  <button
    type="button"
    class="theme-toggle"
    (click)="cycleTheme()"
    [attr.aria-label]="themeToggleLabel"
    [attr.title]="themeToggleLabel"
  >
    <svg
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <ng-container [ngSwitch]="themePreference">
        <ng-container *ngSwitchCase="'light'">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </ng-container>
        <path *ngSwitchCase="'dark'" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        <ng-container *ngSwitchDefault>
          <circle cx="12" cy="12" r="9" />
          <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" />
        </ng-container>
      </ng-container>
    </svg>
  </button>
  <span class="theme-hint" role="status" *ngIf="hintVisible()">{{ hintMessage }}</span>
</span>
