  <text x="320" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="3">7,641 ISLANDS TOUR</text>
  <rect y="352" width="213" height="8" fill="#0038a8" />
  <rect x="213" y="352" width="214" height="8" fill="#ce1126" />
  <rect x="427" y="352" width="213" height="8" fill="#fcd116" />
</svg>
