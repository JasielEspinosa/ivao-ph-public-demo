<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A route linking islands on a map">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8ae0" />
      <stop offset="1" stop-color="#0b4fa8" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#water)" />
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M0 60 C160 40 320 80 640 50" />
    <path d="M0 140 C200 120 360 170 640 130" />
    <path d="M0 230 C180 210 380 260 640 220" />
    <path d="M0 310 C220 290 400 330 640 300" />
  </g>
  <!-- islands: shallow water ring, sand, green land -->
  <g>
    <ellipse cx="150" cy="96" rx="64" ry="34" fill="#5fe0d8" opacity="0.45" />
    <path d="M96 96 C100 70 140 60 170 70 C196 78 208 98 190 112 C166 128 110 124 96 96 Z" fill="#f2dfa5" />
    <path d="M110 94 C116 76 142 70 164 78 C182 84 190 98 178 106 C160 116 120 112 110 94 Z" fill="#1f9e4a" />
  </g>
  <g>
    <ellipse cx="330" cy="188" rx="84" ry="42" fill="#5fe0d8" opacity="0.45" />
    <path d="M262 186 C268 156 316 144 356 154 C392 164 408 190 388 210 C358 232 276 224 262 186 Z" fill="#f2dfa5" />
    <path d="M278 184 C284 164 320 156 352 164 C378 172 390 190 374 204 C350 220 288 212 278 184 Z" fill="#1f9e4a" />
    <path d="M300 186 C310 170 336 168 352 178 C340 196 312 200 300 186 Z" fill="#146b34" />
  </g>
  <g>
    <ellipse cx="520" cy="276" rx="66" ry="34" fill="#5fe0d8" opacity="0.45" />
    <path d="M468 276 C472 252 510 244 542 252 C568 260 578 282 560 296 C534 312 478 304 468 276 Z" fill="#f2dfa5" />
    <path d="M482 274 C488 258 514 254 536 260 C552 266 560 280 548 288 C530 298 492 294 482 274 Z" fill="#1f9e4a" />
  </g>
  <!-- route -->
  <path d="M150 96 C230 90 250 150 330 188 C410 226 440 262 520 276" fill="none" stroke="#fcd116" stroke-width="4" stroke-dasharray="4 10" stroke-linecap="round" />
  <g fill="#ce1126" stroke="#ffffff" stroke-width="3">
    <circle cx="150" cy="96" r="9" /><circle cx="330" cy="188" r="9" /><circle cx="520" cy="276" r="9" />
  </g>
  <!-- small plane marker on the route -->
  <g transform="translate(236 130) rotate(32)" fill="#ffffff">
    <path d="M0 -16 L5 -4 L24 8 L24 14 L5 8 L4 22 L11 28 L11 32 L0 29 L-11 32 L-11 28 L-4 22 L-5 8 L-24 14 L-24 8 L-5 -4 Z" />
