name: Deploy web to GitHub Pages

# Publishes the Angular front end (web/) as a static site.
# UI preview only: the NestJS backend is not hosted on GitHub Pages, so pages that call the API will not load data.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:00, 14:00 and 20:00 Philippine time, i.e. between 8 AM and 11 PM.
    - cron: '0 8,14,20 * * *'
      timezone: 'Asia/Manila'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Refresh the demo NOTAM snapshot
        working-directory: web
        run: node scripts/fetch-demo-notams.mjs

      - name: Build
        working-directory: web
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: SPA fallback for deep links and refresh
        run: cp web/dist/web/browser/index.html web/dist/web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
